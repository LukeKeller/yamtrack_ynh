location __PATH__/static/ {
    alias __INSTALL_DIR__/src/staticfiles/;
    expires 30d;
    access_log off;
}

# Public endpoints — bypass YunoHost SSO so external services can POST with
# their own auth (Authorization header for ListenBrainz, token-in-URL for the
# media-server webhooks, kosync x-auth-* headers for KOReader). Without
# this, SSO 302-redirects unauthenticated requests to the login page and
# ignores the Authorization header. Keep this list in sync with
# api.additional_urls in manifest.toml — the two are independent gates and
# both must allow the path.
location ~ ^__PATH__(/(webhook|api/scrobble|api/koreader|library/opds)(/.*)?)$ {
    # Strip __PATH__ via a capture-in-proxy_pass instead of a `rewrite`:
    # a rewrite would mutate $uri, and SSOWAT's allowlist check (at the
    # access phase, after rewrites) would then see the stripped path and
    # 302 to login. Variables in proxy_pass ARE allowed in regex locations
    # and don't touch $uri. $is_args$args preserves the query string.
    proxy_pass http://127.0.0.1:__PORT__$1$is_args$args;
    include    proxy_params;
    # YunoHost's plain `proxy_params` does not forward the Authorization
    # header (the `_with_auth` variant does, but that variant also injects
    # YNH_USER / X-Forwarded-User which we don't want trusted on a
    # public-by-design endpoint). The OPDS catalog uses HTTP Basic against
    # the per-user API token, so it needs Authorization to pass through.
    # The kosync endpoints use custom x-auth-* headers which are forwarded
    # by default; adding this line is a no-op for them.
    proxy_set_header Authorization $http_authorization;
    proxy_redirect off;
    client_max_body_size 50M;
}

location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;
    include    proxy_params_with_auth;

    proxy_redirect off;

    client_max_body_size 50M;
}
